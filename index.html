<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Who Wins?">
<meta name="theme-color" content="#2b3a8c">
<title>Who Wins?</title>
<style>
:root{--bg:#eef1fb;--card:#fff;--ink:#1c2340;--muted:#5d6685;--line:#d9deef;--brand:#2b3a8c;--win:#14804a;--lose:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#12162b;--card:#1e2442;--ink:#f2f4ff;--muted:#a8b0d0;--line:#343b63;--brand:#3c4db3;--win:#4cd98f;--lose:#ff8a7a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
header{background:#2b3a8c;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;text-align:center}
h1{margin:0;font-size:24px;letter-spacing:.2px}
main{max-width:560px;margin:0 auto;padding:16px}
.pickers{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.vs{font-weight:800;color:var(--muted)}
.pick{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 6px;min-height:176px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}
.pick img{width:104px;height:104px;object-fit:contain}
.pick .name{font-weight:700;overflow-wrap:anywhere}
.pick .empty{color:var(--muted);font-weight:600}
.plus{font-size:40px;line-height:1;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.chip{font-size:12px;font-weight:700;color:#fff;border-radius:99px;padding:1px 8px;text-transform:capitalize;text-shadow:0 1px 1px #0006}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px;font-weight:600;min-height:46px}
#result{margin-top:16px}
.banner{background:var(--card);border-radius:18px;padding:18px;text-align:center;border:2px solid var(--line)}
.banner img{width:150px;height:150px;object-fit:contain}
.banner h2{margin:2px 0 4px;font-size:28px;line-height:1.15}
.odds{color:var(--muted);font-weight:600}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:14px 0 6px;background:var(--line)}
.bar i{display:block}
.barlabels{display:flex;justify-content:space-between;font-size:14px;font-weight:600;gap:8px}
.side{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.side h3{margin:0 0 8px;font-size:18px}
.side ul{margin:0;padding-left:20px}
.side li{margin:4px 0}
.good{color:var(--win);font-weight:700}.bad{color:var(--lose);font-weight:700}
.note{color:var(--muted);font-size:13px;margin:16px 2px 8px}
#picker{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5}
#picker.open{display:flex}
.searchbar{display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--card);border-bottom:2px solid var(--line)}
.searchbar input{flex:1;min-width:0;font-size:16px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.searchbar button{background:none;border:0;font-weight:600;padding:0 6px}
#list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
.row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 12px;text-align:left;min-height:64px}
.row img{width:52px;height:52px;object-fit:contain;flex:none}
.row .num{color:var(--muted);font-size:13px}
.row .chips{justify-content:flex-start;margin-left:auto;flex:none}
.nomatch{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><h1>Who Wins?</h1></header>
<main>

  </div>
  <div class="actions">
    <button id="random">Surprise me</button>
    <button id="swap" hidden>Swap sides</button>
  </div>
  <div id="result" aria-live="polite"></div>
  <p class="note">A prediction, not an official result: both are level 50 and use their strongest available moves. Abilities, items and status effects aren't counted. Unofficial fan project, not affiliated with Nintendo or The Pokémon Company.</p>
</main>
<div id="picker" role="dialog" aria-label="Choose a Pokémon">

</div>

function baseDamage(a,d,m){
  const A=m.cat===0?a.atk:a.spa, D=m.cat===0?d.def:d.spd;
  const stab=a.types.includes(m.type)?1.5:1;
  return ((2*LEVEL/5+2)*m.power*A/D/50+2)*stab*eff(m.type,d.types);
}
function bestMove(a,d){
  let best=STRUGGLE,score=0;
  for(const m of a.moves){const s=baseDamage(a,d,m)*m.acc/100;if(s>score){score=s;best=m}}
  return best;
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fight(F,M,r){
  let hp=[F[0].hp,F[1].hp];
  for(let turn=0;turn<300;turn++){
    const first=F[0].spe===F[1].spe?(r()<.5?0:1):(F[0].spe>F[1].spe?0:1);
    for(const i of[first,1-first]){
      const j=1-i,m=M[i];
      if(r()*100<m.acc){
        const crit=r()<1/24?1.5:1;
        hp[j]-=Math.max(1,Math.floor(baseDamage(F[i],F[j],m)*(.85+r()*.15)*crit));
      }
      if(hp[j]<=0)return i;
      if(m===STRUGGLE){hp[i]-=Math.max(1,Math.floor(F[i].hp/4));if(hp[i]<=0)return j}
    }
  }
  return -1;
}
function predict(a,b){
  const F=[fighter(a,b),fighter(b,a)];
  const M=[bestMove(F[0],F[1]),bestMove(F[1],F[0])];
  const r=rng(a.id*5003+b.id); // same pair, same answer
  const wins=[0,0],N=2000;
  for(let k=0;k<N;k++){const w=fight(F,M,r);if(w>=0)wins[w]++}
  const hits=[0,1].map(i=>{const avg=baseDamage(F[i],F[1-i],M[i])*.925;return Math.max(1,Math.ceil(F[1-i].hp/avg))});
  return{F,M,hits,pct:[wins[0]/N*100,wins[1]/N*100]};
}

/* ---- Screen ---- */
const picks=[null,null];let active=0;
function renderPick(i){
  const el=document.getElementById("pick"+i),p=picks[i];
  el.innerHTML=p?`<img src="${art(p.id)}" alt="" onerror="this.src='${sprite(p.id)}'"><span class="name">${esc(p.name)}</span>${chips(p.types)}`:`<span class="plus">+</span><span class="empty">Choose</span>`;
}
function effText(x){
  if(x===0)return'<span class="bad">has no effect</span>';
  if(x>=2)return`<span class="good">is super effective (×${x})</span>`;
  if(x<1)return`<span class="bad">is not very effective (×${x})</span>`;
  return"does normal damage";
}
function sideCard(R,i){
  const f=R.F[i],o=R.F[1-i],m=R.M[i],n=esc(f.p.name),t=DATA.types[m.type];
  const speed=f.spe===o.spe?"Same speed, so either could attack first":f.spe>o.spe?"Faster, so it attacks first":"Slower, so it attacks second";
  const hit=R.hits[i]===1?"about 1 hit":`about ${R.hits[i]} hits`;
  const items=[];
  if(f.copied)items.push(`Ditto transforms into ${esc(o.p.name)} and copies its moves`);
  if(m===STRUGGLE){items.push(`Has no attack that works here, so it uses <b>Struggle</b>, which also hurts itself`)}
  else items.push(`Best move: <b>${esc(m.name)}</b> (${t}), which ${effText(eff(m.type,o.types))}`);
  items.push(`Needs ${hit} to win`);
  items.push(speed);
  return`<section class="side"><h3>${n}</h3><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></section>`;
}
function show(){
  document.getElementById("swap").hidden=!(picks[0]&&picks[1]);
  const box=document.getElementById("result");
  if(!(picks[0]&&picks[1])){box.innerHTML="";return}
  const R=predict(picks[0],picks[1]);
  const w=R.pct[0]>=R.pct[1]?0:1,pc=R.pct[w],win=R.F[w].p;
  const close=pc<55;
  const same=picks[0].id===picks[1].id;
  const head=same?"It's a tie!":close?`${esc(win.name)}, just barely!`:`${esc(win.name)} wins!`;
  const n10=Math.round(pc/10);
  const odds=same?"Same Pokémon, so either could win":pc>=99.5?"Wins almost every time":`Wins about ${n10} out of 10 battles`;
  const c0=TYPE_COLORS[DATA.types[picks[0].types[0]]],c1=TYPE_COLORS[DATA.types[picks[1].types[0]]];
  box.innerHTML=`<div class="banner"><img src="${art(win.id)}" alt="${esc(win.name)}" onerror="this.src='${sprite(win.id)}'"><h2>${head}</h2><div class="odds">${odds}</div>
  <div class="bar" role="img" aria-label="${esc(picks[0].name)} ${Math.round(R.pct[0])} percent, ${esc(picks[1].name)} ${Math.round(R.pct[1])} percent"><i style="width:${R.pct[0]}%;background:${c0}"></i><i style="width:${R.pct[1]}%;background:${c1}"></i></div>
  <div class="barlabels"><span>${esc(picks[0].name)} ${Math.round(R.pct[0])}%</span><span>${esc(picks[1].name)} ${Math.round(R.pct[1])}%</span></div></div>${sideCard(R,0)}${sideCard(R,1)}`;
  box.scrollIntoView({behavior:"smooth",block:"start"});
}
function setPick(i,p){picks[i]=p;renderPick(i);show()}

const picker=document.getElementById("picker"),list=document.getElementById("list"),search=document.getElementById("search");
function renderList(q){
  q=q.trim().toLowerCase();
  const hits=POKES.filter(p=>!q||p.name.toLowerCase().includes(q)||String(p.id)===q.replace(/^#/,""));
  list.innerHTML=hits.length?hits.map(p=>`<button class="row" data-id="${p.id}"><img loading="lazy" src="${sprite(p.id)}" alt=""><span><b>${esc(p.name)}</b><br><span class="num">#${p.id}</span></span>${chips(p.types)}</button>`).join(""):`<div class="nomatch">No Pokémon found</div>`;
  list.scrollTop=0;
}
function openPicker(i){active=i;search.value="";renderList("");picker.classList.add("open");search.focus()}
function closePicker(){picker.classList.remove("open")}
document.getElementById("pick0").onclick=()=>openPicker(0);
document.getElementById("pick1").onclick=()=>openPicker(1);
document.getElementById("close").onclick=closePicker;
search.oninput=()=>renderList(search.value);
list.onclick=e=>{const b=e.target.closest(".row");if(!b)return;closePicker();setPick(active,POKES.find(p=>p.id===+b.dataset.id))};
document.getElementById("random").onclick=()=>{const r=()=>POKES[Math.floor(Math.random()*POKES.length)];picks[0]=r();do{picks[1]=r()}while(picks[1]===picks[0]);renderPick(0);renderPick(1);show()};
document.getElementById("swap").onclick=()=>{[picks[0],picks[1]]=[picks[1],picks[0]];renderPick(0);renderPick(1);show()};
renderPick(0);renderPick(1);
</script>
